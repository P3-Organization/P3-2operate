<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/navigationbar.css">
    <link rel="stylesheet" href="/css/design.css">
    <link rel="stylesheet" href="/css/notifications.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Notification</title>

</head>
<body>
    <nav class="Navigationbar">
        <ul>
            <li id="btn"><a href="#">Profil</a></li>
            <li><a href="/battery">Batteri</a></li>
            <li><a href="/notifications">Notifikationer</a></li>
            <li><a href="/roomOverview">Værelser</a></li>
            <li><a href="/index">Hjem</a></li>
        </ul>
    </nav>
    
    <div class="sidebar">
        <div class="info">
            <img src="/images/Profile_image.avif" class="user_image">
            <h3>Profil Info:</h3>
            <p>Navn:</p>
            <p>Email:</p>
            <p>Adgang:</p>
        </div>
        <ul>
            <li>
                <a href="#">
                    <i class="bx bx-body"></i>
                    <span class="nav-item">Kontakt Os</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="bx bx-cog"></i>
                    <span class="nav-item">Systemindstillinger</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="bx bx-log-out"></i>
                    <span class="nav-item">Log Ud</span>
                </a>
            </li>
        </ul>
    </div>

    <!--Code for this page starts in this <div> seen below-->
    <div class="main-content">
        <div class="container">
            <h1>Notifikationer</h1>
        </div>
    </div>

    <div class = "box">
        <div class="top-row">
            <div>
                <button class="tab-button active-tab" id="inboxButton" onclick="showInbox()">
                    Inbox <span class="red-dot">&#9679;</span>
                </button>

                <button class="tab-button" id="unseenButton" onclick="showUnseen()">
                    Unseen notification <span class="red-dot">#&9679;</span>
                </button>
            </div>

            <input type="text" class="search-box" id="searchBox"
                    placeholder="Search in notifications" onkeyup="searchNotes()">
        </div>

        <div id="noteList">
            <div class="note note-unseen" data-text="turn on pump">
                Turn on pump <span class="red-dot">&#9679;</span>
            </div>

             <div class="note note-seen" data text="charge battery from 13.00 to 16.00">
                Charge battery from 13.00 to 16.00
             </div>
        </div>

    <p class ="no-result" id="noResult">No notifications found.</p>
</div>

<script>
    let btn = document.querySelector('#btn');
    let sidebar = document.querySelector('.sidebar');

    btn.onclick = function() {
        sidebar.classList.toggle('active');
    };
    // to track which tabs are open we use all or unseen.

    let currentTab = "all";

    function showInbox() {
        currentTab = "all";
        document.getElementById("inboxButton").classList.add("active-tab");
        document.getElementById("unseenButton").classList.remove("active-tab");
        searchNotes();
    }

    function showUnseen() {
        currentTab = "unseen";
        document.getElementById("unseenButton").classList.add("active-tab");
        document.getElementById("inboxButton").classList.remove("active-tab");
        searchNotes();
    }

    function searchNotes() {
        let searchText = document.getElementById("searchBox").value.toLowerCase();
        let notes = document.querySelectorAll("#noteList .note");
        let found = 0;

        for (let i = 0; i < notes.length; i++) {
            let note = notes [i];
            let textMatch = note.getAttribute("data-text").indexOf(searchText) !== -1;
            let tabMatch = true;

            if (currentTab === "unseen" && !note.classList.contains("note-unseen")) {
                tabMatch = false;
            }

            if (textMatch && tabMatch) {
                note.style.display = "block";
                found++;
            } else {
                note.style.display = "none";
            }
        }

        document.getElementById("noResult").style.display = found === 0 ? "block" : "none";
    }

    searchNotes();
    </script>
</body>
</html>
