<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/navigationbar.css">
    <link rel="stylesheet" href="/css/design.css">
    <link rel="stylesheet" href="/css/register.css">

    <title>Registrer</title>
</head>
<body>
<div class="box">
    <h1>Registrer</h1>
    <form action="/register" method="post">
        <input type="text" name="fuldenavn" placeholder="Indtast fulde navn">
        <input type="password" name="adgangskode" placeholder="Vælg adgangskode">
        <input type="password" name="bekræftAdgangskode" placeholder="Bekræft adgangskode">

        <input class="gap" type="tel" name="telefon" placeholder="Telefon nummer">
        <input type="email" name="email" placeholder="Email">

        <input class="gap" type="text" name="adminKode" placeholder="Indtast admin kode">

        <button type="submit">Enter</button>
    </form>
</div>
</body>
</html>
